version: 2

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

conda:
  environment: conda_envs/environment-docs.yaml

python:
  install:
    - method: pip
      path: .

build:
  os: "ubuntu-22.04"
  tools:
    python: "mambaforge-latest"

search:
  ranking:
    _sources/*: -10
    _modules/*: -5
    genindex.html: -9
    '*__init__.html': -3
    '*dist.html': -3

  ignore:
    - 404.html
    - search.html
    - index.html
